name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: python -m pip install 'poetry>=2,<3'
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-python312-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with test
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: poetry run pytest -q
